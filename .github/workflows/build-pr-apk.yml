
name: Build Lumiverse PR APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch in this fork to build"
        required: true
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      LUMIVERSE_BACKEND_DIR: ${{ github.workspace }}/backend
      CARGO_BUILD_JOBS: 4

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Read pinned backend revision
        id: backend
        run: |
          echo "repository=$(jq -r '.repository' backend-source.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r '.ref' backend-source.json)" >> "$GITHUB_OUTPUT"

      - name: Check out matching Lumiverse backend
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.backend.outputs.repository }}
          ref: ${{ steps.backend.outputs.ref }}
          path: backend

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            protobuf-compiler \
            python3 \
            curl \
            unzip \
            zip

          protoc --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          bun install --frozen-lockfile
          cd frontend
          bun install --frozen-lockfile

      - name: Install Android app dependencies
        run: bun install --frozen-lockfile

      - name: Configure separate test application ID
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = Path("android/tauri/src-tauri/tauri.conf.json")
          data = json.loads(config.read_text())
          data["identifier"] = "chat.lumiverse.test.pr"
          config.write_text(json.dumps(data, indent=2) + "\n")

          gradle = Path(
              "android/tauri/src-tauri/gen/android/app/build.gradle.kts"
          )
          source = gradle.read_text()

          old = 'applicationId = "chat.lumiverse.test"'
          new = 'applicationId = "chat.lumiverse.test.pr"'

          if old not in source:
              raise SystemExit("Original applicationId not found")

          gradle.write_text(source.replace(old, new))

          # The bundled Firebase configuration is registered to the
          # original app ID. Omit it from this separate test installation.
          Path("android/firebase/google-services.json").unlink(missing_ok=True)
          PY

      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: .tmp/android-prototype/debug.keystore
          key: lumiverse-pr-debug-keystore-v1

      - name: Refresh Termux libnghttp2 package pin
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          repository = "https://packages-cf.termux.dev/apt/termux-main/"
          index_url = repository + "dists/stable/main/binary-aarch64/Packages"

          request = urllib.request.Request(
              index_url,
              headers={
                  "User-Agent": "Mozilla/5.0 (compatible; GitHubActionsBuild/1.0)",
                  "Accept": "*/*",
              },
          )

          print("Fetching Termux ARM64 package metadata...")
          with urllib.request.urlopen(request, timeout=60) as response:
              index = response.read().decode()

          package = None

          for stanza in index.split("\n\n"):
              fields = {}
              for line in stanza.splitlines():
                  if line.startswith((" ", "\t")):
                      continue
                  key, separator, value = line.partition(": ")
                  if separator:
                      fields[key] = value.strip()

              if fields.get("Package") == "libnghttp2":
                  package = fields
                  break

          if not package:
              raise SystemExit("libnghttp2 not found")

          required = ("Version", "Filename", "SHA256")
          if any(not package.get(field) for field in required):
              raise SystemExit("Incomplete package metadata")

          path = Path("android/native/termux-aarch64.json")
          data = json.loads(path.read_text())
          data["repository"] = repository

          entry = next(
              (p for p in data["packages"] if p["Package"] == "libnghttp2"),
              None
          )

          if not entry:
              raise SystemExit("libnghttp2 missing from package lock")

          for field in required:
              entry[field] = package[field]

          path.write_text(json.dumps(data, indent=2) + "\n")

          print("Updated package:")
          print("Version:", package["Version"])
          print("Filename:", package["Filename"])
          print("SHA256:", package["SHA256"])
          PY

      - name: Cache Android native build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            .tmp/android-native
          key: ${{ runner.os }}-android-native-rust197-ndk28c-${{ hashFiles('backend-source.json', 'android/native/termux-aarch64.json', 'android/native/object-store-android.rs', '**/Cargo.lock', 'scripts/build-*-android-native.ts') }}
          restore-keys: |
            ${{ runner.os }}-android-native-rust197-ndk28c-

      - name: Build Android native dependencies
        run: bun run build:android-native

      - name: Build APK
        run: bun run build:android-tauri

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumiverse-pr-test-apk
          path: |
            dist/android/lumiverse-tauri-arm64.apk
            dist/android/lumiverse-tauri-arm64.apk.json
            dist/android/lumiverse-tauri-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
