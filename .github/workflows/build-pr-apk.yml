name: Build Lumiverse PR APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch in this fork to build"
        required: true
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      LUMIVERSE_BACKEND_DIR: ${{ github.workspace }}/backend
      CARGO_BUILD_JOBS: 4

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Read pinned backend revision
        id: backend
        run: |
          echo "repository=$(jq -r '.repository' backend-source.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r '.ref' backend-source.json)" >> "$GITHUB_OUTPUT"

      - name: Check out matching Lumiverse backend
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.backend.outputs.repository }}
          ref: ${{ steps.backend.outputs.ref }}
          path: backend

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            protobuf-compiler \
            python3 \
            curl \
            unzip \
            zip

          protoc --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          bun install --frozen-lockfile
          cd frontend
          bun install --frozen-lockfile

      - name: Install Android app dependencies
        run: bun install --frozen-lockfile

      - name: Configure test application identifier
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = Path("android/tauri/src-tauri/tauri.conf.json")
          data = json.loads(config.read_text())
          data["identifier"] = "chat.lumiverse.test.pr"
          config.write_text(json.dumps(data, indent=2) + "\n")

          # Firebase configuration belongs to the original application ID.
          Path("android/firebase/google-services.json").unlink(missing_ok=True)
          PY

      - name: Refresh Termux ARM64 package metadata
        run: |
          python3 - <<'PY'
          import gzip
          import json
          import urllib.request
          from pathlib import Path

          base = "https://ftp.fau.de/termux/termux-main/"
          index_url = base + "dists/stable/main/binary-aarch64/Packages.gz"
          lock_path = Path("android/native/termux-aarch64.json")

          print(f"Fetching package index: {index_url}")

          request = urllib.request.Request(
              index_url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              index_data = gzip.decompress(response.read()).decode("utf-8")

          available = {}

          for paragraph in index_data.split("\n\n"):
              fields = {}

              for line in paragraph.splitlines():
                  if line and not line[0].isspace() and ":" in line:
                      key, value = line.split(":", 1)
                      fields[key] = value.strip()

              if "Package" in fields:
                  available[fields["Package"]] = fields

          lock = json.loads(lock_path.read_text())

          for package in lock["packages"]:
              name = package["Package"]

              if name not in available:
                  raise SystemExit(f"Package missing from mirror index: {name}")

              entry = available[name]

              for field in ("Version", "Filename", "SHA256"):
                  if field not in entry:
                      raise SystemExit(f"{name}: index is missing {field}")

                  package[field] = entry[field]

          lock["repository"] = base
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          print(f"Refreshed {len(lock['packages'])} Termux packages.")
          PY

      - name: Refresh FFmpeg package lock
        run: |
          python3 - <<'PY'
          import gzip
          import json
          import urllib.request
          from pathlib import Path

          lock_path = Path("android/native/ffmpeg-aarch64.json")
          lock = json.loads(lock_path.read_text())

          base = "https://ftp.fau.de/termux/termux-main/"
          index_url = base + "dists/stable/main/binary-aarch64/Packages.gz"

          request = urllib.request.Request(
              index_url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              content = gzip.decompress(response.read()).decode()

          packages = {}

          for paragraph in content.split("\n\n"):
              entry = {}

              for line in paragraph.splitlines():
                  if line and not line[0].isspace() and ": " in line:
                      key, value = line.split(": ", 1)
                      entry[key] = value

              if entry.get("Package") and entry.get("Filename"):
                  packages[entry["Package"]] = entry

          for pkg in lock["packages"]:
              current = packages.get(pkg["Package"])

              if not current:
                  raise SystemExit(
                      f"Package missing from mirror index: {pkg['Package']}"
                  )

              for field in ("Version", "Filename", "SHA256"):
                  if field not in current:
                      raise SystemExit(
                          f"{pkg['Package']}: missing {field} in package index"
                      )

                  pkg[field] = current[field]

          lock["repository"] = base
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          print(f"Refreshed {len(lock['packages'])} FFmpeg package entries.")
          PY

      - name: Refresh Git package lock
        run: |
          python3 - <<'PY'
          import gzip
          import json
          import urllib.request
          from pathlib import Path

          lock_path = Path("android/native/git-aarch64.json")
          lock = json.loads(lock_path.read_text())

          base = "https://ftp.fau.de/termux/termux-main/"
          index_url = base + "dists/stable/main/binary-aarch64/Packages.gz"

          request = urllib.request.Request(
              index_url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              content = gzip.decompress(response.read()).decode()

          packages = {}

          for paragraph in content.split("\n\n"):
              entry = {}

              for line in paragraph.splitlines():
                  if line and not line[0].isspace() and ": " in line:
                      key, value = line.split(": ", 1)
                      entry[key] = value

              if entry.get("Package") and entry.get("Filename"):
                  packages[entry["Package"]] = entry

          for pkg in lock["packages"]:
              current = packages.get(pkg["Package"])

              if not current:
                  raise SystemExit(
                      f"Package missing from mirror index: {pkg['Package']}"
                  )

              for field in ("Version", "Filename", "SHA256"):
                  if field not in current:
                      raise SystemExit(
                          f"{pkg['Package']}: missing {field} in package index"
                      )

                  pkg[field] = current[field]

          lock["repository"] = base
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          print(f"Refreshed {len(lock['packages'])} Git package entries.")
          PY

      - name: Verify Termux package metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("android/native/termux-aarch64.json").read_text()
          )

          package = next(
              p for p in data["packages"]
              if p["Package"] == "libnghttp2"
          )

          print("Version:", package["Version"])
          print("Filename:", package["Filename"])
          print("SHA256:", package["SHA256"])
          print("Repository:", data["repository"])
          PY

      - name: Cache Android native build outputs
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            .tmp/android-native
          key: ${{ runner.os }}-android-native-rust197-ndk28c-${{ hashFiles('backend-source.json', 'android/native/termux-aarch64.json', 'android/native/ffmpeg-aarch64.json', 'android/native/git-aarch64.json', 'android/native/object-store-android.rs', '**/Cargo.lock', 'scripts/build-*-android-native.ts') }}
          restore-keys: |
            ${{ runner.os }}-android-native-rust197-ndk28c-

      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: .tmp/android-prototype/debug.keystore
          key: lumiverse-pr-debug-keystore-v1

      - name: Build Android native dependencies
        run: bun run build:android-native

      - name: Save Android native build cache
        if: success() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            .tmp/android-native
          key: ${{ runner.os }}-android-native-rust197-ndk28c-${{ hashFiles('backend-source.json', 'android/native/termux-aarch64.json', 'android/native/ffmpeg-aarch64.json', 'android/native/git-aarch64.json', 'android/native/object-store-android.rs', '**/Cargo.lock', 'scripts/build-*-android-native.ts') }}

      - name: Preserve original Android namespace
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          gradle = Path(
              "android/tauri/src-tauri/gen/android/app/build.gradle.kts"
          )

          if not gradle.exists():
              raise SystemExit(f"Expected generated Gradle file: {gradle}")

          source = gradle.read_text()
          match = re.search(r'(?m)^\s*namespace\s*=\s*"([^"]+)"', source)

          if not match:
              raise SystemExit("Could not find original Android namespace")

          output = Path(".tmp/original-android-namespace.txt")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(match.group(1))

          print("Preserved namespace:", match.group(1))
          PY

      - name: Reinitialize Android project for test application ID
        run: |
          rm -rf android/tauri/src-tauri/gen/android
          bunx tauri android init

      - name: Configure generated Android application ID
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          gradle = Path("android/tauri/src-tauri/gen/android/app/build.gradle.kts")
          source = gradle.read_text()

          namespace_file = Path(".tmp/original-android-namespace.txt")
          original_namespace = namespace_file.read_text().strip()

          # Preserve the original namespace.
          source, count = re.subn(
              r'(?m)^(\s*namespace\s*=\s*)"[^"]+"',
              lambda m: m.group(1) + f'"{original_namespace}"',
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Could not restore original Android namespace")

          # Set the separate test application ID.
          old = 'applicationId = "chat.lumiverse.test"'
          new = 'applicationId = "chat.lumiverse.test.pr"'

          if new not in source:
              if old not in source:
                  raise SystemExit("Could not find the expected applicationId")
              source = source.replace(old, new, 1)

          # Ensure BuildConfig is generated.
          if re.search(r'buildFeatures\s*\{', source):
              source = re.sub(
                  r'buildFeatures\s*\{',
                  'buildFeatures {\n        buildConfig = true',
                  source,
                  count=1
              )
          else:
              source, count = re.subn(
                  r'(?m)^(\s*)buildTypes\s*\{',
                  r'\1buildFeatures {\n\1    buildConfig = true\n\1}\n\n\1buildTypes {',
                  source,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not insert buildFeatures block")

          gradle.write_text(source)
          print("Configured test applicationId and enabled BuildConfig")
          PY

      - name: Diagnose Android BuildConfig package
        shell: bash
        run: |
          echo "=== Gradle namespace and BuildConfig settings ==="
          grep -n -E 'namespace|applicationId|buildConfig' \
            android/tauri/src-tauri/gen/android/app/build.gradle.kts

          echo "=== Logger.kt package and BuildConfig reference ==="
          sed -n '1,100p' \
            android/tauri/src-tauri/gen/android/app/src/main/java/chat/lumiverse/test/pr/generated/Logger.kt

          echo "=== Generated BuildConfig files ==="
          find android/tauri/src-tauri/gen/android -iname '*BuildConfig*' -print

      - name: Build APK
        run: bun run build:android-tauri

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lumiverse-pr-test-apk
          path: |
            dist/android/lumiverse-tauri-arm64.apk
            dist/android/lumiverse-tauri-arm64.apk.json
            dist/android/lumiverse-tauri-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
